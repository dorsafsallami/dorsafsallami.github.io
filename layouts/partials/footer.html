<footer class="site-footer">
  <div class="container">
    <span>&copy; {{ now.Year }} {{ site.Params.author }}</span>
    <span class="sep" aria-hidden="true">·</span>
    <span>Last updated {{ now.Format "January 2006" }}</span>
  </div>
</footer>
<script>
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  var colorMeta = document.getElementById("theme-color");

  function currentTheme() {
    return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  function applyTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    root.style.colorScheme = theme;
    if (colorMeta) colorMeta.setAttribute("content", theme === "dark" ? "#121417" : "#ffffff");
    if (button) {
      button.setAttribute("aria-label", theme === "dark" ? "Switch to light theme" : "Switch to dark theme");
    }
    if (persist) localStorage.setItem("theme", theme);
  }

  applyTheme(currentTheme(), false);

  if (button) {
    button.addEventListener("click", function () {
      applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
    });
  }

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (event) {
    if (!localStorage.getItem("theme")) {
      applyTheme(event.matches ? "dark" : "light", false);
    }
  });
})();
</script>
